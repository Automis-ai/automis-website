name: SEO check

# Guards the technical SEO rules that a manual sweep cannot hold.
#
# In July 2026 every Ahrefs issue was fixed by hand and the site hit a 100 health
# score. Six weeks later it was 62: the PT site shipped without the <=155 char meta
# description rule, three blog indexes lost their og:image to Next's shallow merge of
# nested openGraph, and a partner badge started answering 403 on all 78 pages. No
# single change was careless; nothing was checking, and the site publishes five bot
# articles a week.
#
# It runs on `deployment_status` rather than on push, so it always tests a URL Vercel
# has finished deploying, never a half-landed one. That covers both paths into
# production: a pull-request preview, and the blog bot committing straight to main.
# The weekly run catches rot that no commit causes, such as an external image that
# starts 403ing.

on:
  deployment_status:
  schedule:
    # Mondays 06:00 UTC, before the weekly Ahrefs crawl rather than after it.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL to check"
        default: "https://automis.ai"

jobs:
  seo-check:
    # deployment_status fires for every state (pending, error, success); only a live
    # deployment is worth crawling.
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve base URL
        id: base
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Vercel's environment_url is ALWAYS the immutable deployment URL
          # (automis-website-<hash>-automis-team.vercel.app), never the production
          # domain, and it is SSO-protected. Matching "automis.ai" against it silently
          # skipped every run, production included: 8 green checkmarks, nothing checked.
          # Production is therefore pinned to the domain Ahrefs actually crawls, and
          # only previews use environment_url.
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          ENV_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -eu

          if [ "${{ github.event_name }}" != "deployment_status" ]; then
            echo "base=${{ inputs.base || 'https://automis.ai' }}" >> "$GITHUB_OUTPUT"
            echo "Checking ${{ inputs.base || 'https://automis.ai' }}"
            exit 0
          fi

          # This repo feeds TWO Vercel projects: automis-website (automis.ai) and
          # voice-automis-it (voice.automis.ai). Both fire deployment_status here, and
          # the voice site has its own sitemap, so crawling it with this config would
          # fail for the wrong reason. Only the main site is in scope.
          #
          # The project name lives in `environment`, which Vercel sets to e.g.
          # "Production – automis-website". target_url and environment_url are both
          # just the deployment URL, so neither can tell the projects apart.
          echo "environment: $ENVIRONMENT"
          case "$ENVIRONMENT" in
            *voice-automis*)
              echo "::notice::Ignoring a voice.automis.ai deployment ($ENVIRONMENT); this workflow covers automis.ai."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *automis-website*) ;;
            *)
              # Deliberately loud, not skipped. An unrecognised environment string
              # (a Vercel project rename) would otherwise disable this guard silently,
              # which is the exact failure it exists to catch.
              echo "::error::Unrecognised deployment environment '$ENVIRONMENT'. Update the project filter in this workflow, or the SEO check is silently no longer running."
              exit 1
              ;;
          esac

          case "$ENVIRONMENT" in
            [Pp]roduction*)
              BASE="https://automis.ai"
              # The alias flips to the new deployment around the time this event
              # fires. Settle first, or the run can grade the previous build.
              for _ in $(seq 1 20); do
                sleep 5
                if [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")" = "200" ]; then break; fi
              done
              ;;
            *)
              # Preview deployments sit behind Vercel deployment protection: without
              # the bypass secret every page answers 302 to vercel.com/sso-api and the
              # run would fail for a reason that has nothing to do with SEO.
              BASE="$ENV_URL"
              if [ -z "$BYPASS" ]; then
                echo "::notice::Skipping preview $BASE — needs VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → project → Deployment Protection → Protection Bypass for Automation) as a repo secret to check PRs before merge. Production is still checked on every deploy."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Checking $BASE"

      - name: Run SEO check
        if: steps.base.outputs.skip != 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/seo-check.mjs --base "${{ steps.base.outputs.base }}"
